# Dragons Den - Dragons Nest configuration (v0.0.1)
#
# Include from printer.cfg with:
#   [include dragonsnest.cfg]
#
# Everything above the "#~#" state block is yours to edit. The state block is
# appended at the bottom by dragons_den the first time it saves anything (dock
# coordinates, tool offsets, active tool). Its lines start with "#", so Klipper
# treats them as comments; do not edit them by hand.

[dragons_den]
tool_count: 2
#   Number of tools, T0..T(n-1). T0 is the reference tool (offset 0,0,0).
kinematics_type: fixed_gantry
#   fixed_gantry    (e.g. Voron Trident): docks store X, Y
#   floating_gantry (e.g. Voron 2.4, Sovol SV08): docks store X, Y, Z
probe_type: usb_camera
#   eddy | sexball | usb_camera
dock_x_travel: -5.0
#   X slide that locks the hotend into its dock (undock uses the opposite).
lock_retract_dist: 3.0
#   Extruder move that unlocks (retract) / locks (extrude) the hotend.
clear_y_dist: 70.0
#   Pull-back clearance. Docks are on a FRONT-mounted dock bar (low Y) and
#   open toward +Y: the toolhead approaches a dock moving -Y and pulls out
#   moving +Y, to dock_y + clear_y_dist.
#front_dock_max_y:
#   Highest allowed dock Y. Unset: docks must be in the front half of the
#   Y axis (dock_y < middle of Y travel). Rear docks are rejected.

# --- Motion (mm, mm/s) ---
#travel_speed: 150
#dock_speed: 50
#verify_speed: 10
#z_speed: 15
#jog_speed: 50
#lock_speed: 20
#z_hop: 5
#extruder: extruder
#register_t_commands: True
#   Set False if you define your own T0..Tn macros (call DRAGONS_SELECT_TOOL).

# --- sexball offset calibration ---
#ball_od: 6.35
#   Calibration ball diameter, measured with calipers. Required for sexball.
#ball_center: 150, 150
#   Estimated ball center "x, y" (ball resting on the bed) or "x, y, z".
#ball_clearance: 5

# --- eddy offset calibration ---
#eddy_xy_target: 150, 150
#   Fixed XY target the nozzle is jogged to for the XY offset.
#eddy_z_point: 150, 150
#   Bed spot every nozzle probes for the Z offset.
#eddy_probe_method: tap
#   Passed as PROBE METHOD=<value>. Leave empty for a plain PROBE.
#probe_start_z: 5

# --- usb_camera offset calibration ---
#camera_position: 150, 20, 10
#   Estimated toolhead X, Y, Z with T0's nozzle over the camera lens.
#camera_url: /webcam/?action=stream
#camera_circle_px: 60

# --- Paper Z-test (DRAGONS_PAPER_TEST) ---
#paper_test_point: 150, 150
#   Bed spot for the manual paper Z-test. Defaults to the bed center.

# --- Persistence ---
#nest_file: ~/printer_data/config/dragonsnest.cfg
#   Defaults to dragonsnest.cfg next to printer.cfg. Set this if you include
#   the file from a subfolder.
